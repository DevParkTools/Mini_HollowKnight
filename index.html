if(window.visualViewport){window.visualViewport.addEventListener('resize',resize)}
document.addEventListener('visibilitychange',function(){
if(document.hidden){clearKeys();if(st===1){st=4}if(AC&&AC.state==='running'){AC.suspend()}}});
window.addEventListener('contextmenu',function(e){e.preventDefault()});

var rsw=0,rsh=0;
function loop(ts){
if(window.innerWidth!==rsw||window.innerHeight!==rsh){rsw=window.innerWidth;rsh=window.innerHeight;resize()}
if(!last){last=ts}
acc+=Math.min(ts-last,100);last=ts;
while(acc>=16.667){upd();acc-=16.667}
draw();
requestAnimationFrame(loop)}

buildMap();
tc=(navigator.maxTouchPoints>0&&window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)?1:0;
resize();
resetState();readSlots();init();
st=0;
requestAnimationFrame(loop);
</script>
